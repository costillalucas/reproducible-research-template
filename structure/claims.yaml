# claims.yaml -- the argument skeleton of the deliverable, one record per
# load-bearing claim. Modeled directly on the pattern in
# https://github.com/matiaszaldarriaga/pta-gwb-anisotropy (structure/claims.yaml).
#
# Rules, enforced by scripts/check_provenance.py:
#   - every `data_ref` must be a path that exists in this repo (a citation
#     key would also be valid here if you add a bibliography).
#   - `numbers` are keys in data/numbers.json, written solely by
#     scripts/compute_numbers.py.
#   - `depends_on` lists other claim ids this one relies on -- this is a
#     graph, not a flat list, and every edge is checked to resolve.

claims:
  - id: multispectral_thickness_recovery
    statement: >
      The milestone-2 coupled multispectral pipeline (shared HR grid ->
      independent per-channel reconstruction -> piston removal ->
      synthetic-wavelength unwrapping -> Cauchy dispersion fit) recovers a
      synthetic sample's thickness field, reconstructed through the actual
      Wirtinger flow solver, not injected phase.
    file: report/report.md
    numbers: [multispectral_thickness_correlation]
    evidence:
      - id: ev_thickness_correlation
        description: correlation between recovered and true thickness field
        data_refs:
          - src/ptyco_full_simulator/multispectral.py
          - src/ptyco_full_simulator/reconstruction.py
          - scripts/compute_numbers.py
    depends_on: []
    status: established

  - id: unwrapping_beats_naive
    statement: >
      On a dispersion signal large enough to require real multi-wavelength
      unwrapping (exceeds a single channel's own unambiguous OPL range),
      the coupled pipeline's thickness recovery is dramatically more
      accurate than a naive baseline that assumes every channel's wrap
      number is 0.
    file: report/report.md
    numbers: [unwrapping_error_reduction_factor]
    evidence:
      - id: ev_naive_vs_coupled_comparison
        description: RMSE ratio between the naive (k=0) baseline and the coupled pipeline
        data_refs:
          - src/ptyco_full_simulator/multispectral.py
          - scripts/compute_numbers.py
    depends_on: [multispectral_thickness_recovery]
    status: established

  - id: phase_only_solver_limitation
    statement: >
      The baseline Wirtinger flow reconstructor is far more sensitive to
      amplitude contrast than previously documented: a uniform-amplitude
      (pure phase) object reconstructs worse than random, while the
      identical phase field with only 5% amplitude contrast reconstructs
      acceptably -- a real limitation directly relevant to this project's
      near-transparent biological-sample target.
    file: report/report.md
    numbers: [phase_only_object_phase_correlation, five_percent_contrast_object_phase_correlation]
    evidence:
      - id: ev_amplitude_contrast_sensitivity
        description: >
          identical phase field reconstructed at 0% and 5% amplitude
          contrast, same solver, same iterations -- the negative control
          proving the check can catch this failure mode, not just praise
          a working case
        data_refs:
          - src/ptyco_full_simulator/reconstruction.py
          - scripts/compute_numbers.py
    depends_on: []
    status: established

  - id: led_calibration_recovers_misalignment
    statement: >
      Given a good object-spectrum estimate, the spectral-correlation LED
      position calibration (adapted from eckert2018) recovers a known
      injected rigid misalignment's scale factor closely. It does NOT,
      however, reliably rescue a reconstruction already corrupted by an
      uncorrected misalignment -- the paper's brightfield pre-calibration
      stage, not implemented here, is a real prerequisite, not an optional
      extra (see tests/test_led_calibration.py's documented negative
      result, not itself in this registry since it's a qualitative,
      not numeric, finding).
    file: report/report.md
    numbers: [led_calibration_scale_recovery_error]
    evidence:
      - id: ev_calibration_recovery_error
        description: absolute error between fitted and true injected scale factor
        data_refs:
          - src/ptyco_full_simulator/led_calibration.py
          - references/papers/2018/SelfCalibration_Eckert_1804.03299.pdf
          - scripts/compute_numbers.py
    depends_on: []
    status: established

  - id: tie_informed_initialization_fixes_weak_phase
    statement: >
      Initializing the FPM solver with a Transport of Intensity Equation
      phase estimate (from one simulated extra defocused capture pair)
      instead of the default zero phase reliably escapes the degenerate
      saddle point identified in phase_only_solver_limitation, on a
      mixed-low/high-spatial-frequency phase object.
    file: report/report.md
    numbers: [tie_informed_init_baseline_phase_correlation, tie_informed_init_phase_correlation]
    evidence:
      - id: ev_tie_initialization_gain
        description: phase_correlation with default vs. TIE-informed initialization, same object
        data_refs:
          - src/ptyco_full_simulator/propagation.py
          - src/ptyco_full_simulator/reconstruction.py
          - scripts/compute_numbers.py
    depends_on: [phase_only_solver_limitation]
    status: established

  - id: ransac_rejects_calibration_outliers
    statement: >
      A plain least-squares fit of the LED calibration similarity
      transform is thrown badly off by a minority (10%) of grossly
      miscorrected points; fit_similarity_transform_ransac recovers the
      true transform accurately from the same corrupted data by
      identifying and excluding those outliers.
    file: report/report.md
    numbers: [ransac_plain_fit_rotation_error_rad, ransac_robust_fit_rotation_error_rad]
    evidence:
      - id: ev_ransac_vs_plain_fit
        description: rotation error (radians) of plain vs. RANSAC fit on the same corrupted point set
        data_refs:
          - src/ptyco_full_simulator/led_calibration.py
          - scripts/compute_numbers.py
    depends_on: [led_calibration_recovers_misalignment]
    status: established

  - id: epry_pupil_recovery_corrects_real_aberration
    statement: >
      EPRY pupil recovery (adapted from ou2014) gives a real but modest
      improvement over assuming the ideal pupil when a genuine defocus
      aberration is present, and the recovered pupil's phase actually
      correlates with the true injected aberration -- not just "helps
      the object by coincidence".
    file: report/report.md
    numbers: [epry_uncorrected_phase_correlation, epry_corrected_phase_correlation, epry_recovered_pupil_phase_correlation]
    evidence:
      - id: ev_epry_defocus_correction
        description: phase_correlation with/without EPRY under a known injected defocus aberration, plus recovered-vs-true pupil phase correlation
        data_refs:
          - src/ptyco_full_simulator/reconstruction.py
          - src/ptyco_full_simulator/optics.py
          - references/papers/2014/oe-22-5-4960.pdf
          - scripts/compute_numbers.py
    depends_on: []
    status: established

  - id: epry_regresses_healthy_channel_at_small_scale
    statement: >
      On this project's small (9x9 LED, 12x12px) synthetic testbed, EPRY
      pupil recovery REGRESSES an already-well-converging channel even
      with no aberration present at all -- recover_pupil=True is not a
      safe default to enable unconditionally, and the recovered pupil
      itself stays nearly flat (not "inventing" a fake aberration),
      pointing at the object update's own normalization overfitting
      rather than a runaway pupil estimate.
    file: report/report.md
    numbers: [epry_small_scale_baseline_phase_correlation, epry_small_scale_corrected_phase_correlation]
    evidence:
      - id: ev_epry_small_scale_regression
        description: phase_correlation with/without EPRY, blue channel, no aberration present
        data_refs:
          - src/ptyco_full_simulator/reconstruction.py
          - scripts/compute_numbers.py
    depends_on: [epry_pupil_recovery_corrects_real_aberration]
    status: established

  - id: epry_regression_is_testbed_scale_artifact
    statement: >
      The small-scale regression above does NOT reproduce at a scale
      close to ou2014's own real demonstration (225 LEDs, 64x64px
      instead of 12x12px) -- ruling out "EPRY is badly implemented" in
      favor of "this project's synthetic testbeds are smaller/lower-
      redundancy than EPRY needs to be numerically stable". The
      literature's standard fix for over-aggressive PIE-family
      normalization (rPIE-style regularized denominator) was tried in
      isolation and barely changed the small-scale numbers, further
      pointing at data redundancy rather than a fixable normalization
      choice (not itself in this registry -- an exploratory comparison
      run outside the main codebase, not a maintained script).
    file: report/report.md
    numbers: [epry_paper_scale_baseline_phase_correlation, epry_paper_scale_corrected_phase_correlation]
    evidence:
      - id: ev_epry_paper_scale_no_regression
        description: same no-aberration scenario as epry_regresses_healthy_channel_at_small_scale, at 225 LEDs/64x64px instead of 81 LEDs/12x12px
        data_refs:
          - src/ptyco_full_simulator/reconstruction.py
          - scripts/compute_numbers.py
    depends_on: [epry_regresses_healthy_channel_at_small_scale]
    status: established

  - id: chromatic_diagnostic_recovers_injected_shift
    statement: >
      The chromatic-aberration diagnostic (measure_lateral_shift_px, via
      phase correlation) recovers a known lateral shift deliberately
      injected between two channels' true objects, through the actual
      Wirtinger flow reconstruction (not measured on ideal fields), to
      within a couple pixels -- reconstruction noise, not the
      registration math itself, is the honest limiting factor. A channel
      pair with no injected shift reports near-zero, confirming the
      diagnostic doesn't manufacture a spurious signal. Built and
      validated synthetically since no real lab data exists in this
      Codespace yet -- roadmap open question #2 (does this project's real
      objective have chromatic aberration) still needs real captures to
      actually answer.
    file: report/report.md
    numbers: [chromatic_shift_recovery_error_px, chromatic_shift_no_injection_error_px]
    evidence:
      - id: ev_chromatic_shift_recovery
        description: euclidean pixel error between measured and known-injected lateral shift, with vs. without an injected shift
        data_refs:
          - src/ptyco_full_simulator/chromatic_diagnostics.py
          - scripts/compute_numbers.py
    depends_on: []
    status: established

  - id: adaptive_step_helps_under_heavy_noise
    statement: >
      zuo2016's adaptive step-size rule beats this project's default
      fixed exponential-ramp schedule under heavy Poisson noise and
      enough iterations for the paper's described failure mode (a
      constant step re-introducing noise each cycle) to manifest. An
      earlier same-day exploration at lighter noise and fewer iterations
      found no clean difference; the missing variable was noise severity
      and cycle count, not problem scale (unlike the EPRY finding above,
      which was a scale artifact) -- validated across 8 random seeds
      (8/8 favored adaptive_step, paired mean gain 0.060 +/- 0.012 SE
      phase_correlation), with seed=0 as the exact reproducible number
      quoted here.
    file: report/report.md
    numbers: [adaptive_step_fixed_ramp_phase_correlation, adaptive_step_adaptive_phase_correlation]
    evidence:
      - id: ev_adaptive_step_heavy_noise_gain
        description: phase_correlation with fixed-ramp vs. adaptive step-size, same heavily-noised data, seed=0
        data_refs:
          - src/ptyco_full_simulator/reconstruction.py
          - references/papers/2016/oe-24-18-20724.pdf
          - scripts/compute_numbers.py
    depends_on: []
    status: established

  - id: gd_beats_wirtinger_noiseless
    statement: >
      Plain Adam gradient descent (joint_calibration.reconstruct_and_calibrate
      with calibrate_leds=False) reconstructs this project's standard
      synthetic object better than the Wirtinger flow, noiseless, same data,
      LED positions known -- strikingly so on blue, where the Wirtinger flow
      never converges even at 400 epochs while gradient descent gets there in
      100 iterations. NOT a general advantage: one object, one geometry, and
      the same optimizer does not fix the weak pure-phase saddle point of
      phase_only_solver_limitation (negative test in
      tests/test_gradient_descent_vs_wirtinger.py).
    file: docs/roadmap_agentic_multispectral_pipeline.md
    numbers: [gd_noiseless_blue_wirtinger_phase_correlation, gd_noiseless_blue_gradient_descent_phase_correlation]
    evidence:
      - id: ev_gd_vs_wf_noiseless_blue
        description: phase_correlation of Wirtinger flow (400 epochs) vs gradient descent (100 iterations), blue, bin-aligned k
        data_refs:
          - src/ptyco_full_simulator/joint_calibration.py
          - tests/test_gradient_descent_vs_wirtinger.py
          - scripts/compute_numbers.py
    depends_on: [phase_only_solver_limitation]
    status: established

  - id: gd_amplitude_loss_survives_poisson_noise
    statement: >
      The gradient-descent advantage survives Poisson noise ONLY with the
      amplitude loss (Gaussian noise on |field|); the intensity-L2 and
      Poisson-NLL losses do not hold up. 8-seed sweeps: green +0.462 +/- 0.026
      and red +0.472 +/- 0.013 phase_correlation over the Wirtinger flow at
      peak photon count 20 (8/8 seeds each). Blue is rescued only at peak
      100 and fails for every solver at peak <= 20. seed=0 of the green
      sweep is the exact reproducible number quoted here; the diagnostic
      attempts to decide when to keep iterating after TIE initialization
      (defocus-pair residual, milestone 12) failed -- a qualitative negative
      not in this registry. Synthetic only; no real captures yet.
    file: docs/roadmap_agentic_multispectral_pipeline.md
    numbers: [gd_noise_green_peak20_wirtinger_phase_correlation, gd_noise_green_peak20_gradient_descent_amplitude_phase_correlation]
    evidence:
      - id: ev_gd_amplitude_loss_noise_seed0
        description: phase_correlation of Wirtinger flow vs amplitude-loss gradient descent, green, peak 20, seed 0
        data_refs:
          - src/ptyco_full_simulator/joint_calibration.py
          - scripts/sweep_gd_vs_wf_noise.py
          - tests/test_gradient_descent_vs_wirtinger.py
          - scripts/compute_numbers.py
    depends_on: [gd_beats_wirtinger_noiseless]
    status: established

  - id: inverse_crime_hides_wirtinger_failure_on_exact_k
    statement: >
      The repo's older fake captures (forward_model.simulate_lr_stack) round
      each LED's k to a spectrum bin -- exactly the model the Wirtinger flow
      inverts (an inverse crime). On captures with EXACT k, which is what
      real hardware produces, the Wirtinger flow fails (bin-rounded k model,
      ~0.4 bin mean error) while gradient descent with the continuous-k
      model succeeds; conversely, handing gradient descent a bin-rounded
      grid on exact-k data drops it to ~0.09. All solver comparisons above
      used bin-aligned k on purpose (fair, not realistic), so real LED
      position accuracy is probably the dominant unknown -- to be measured
      with real captures, which do not exist yet.
    file: docs/roadmap_agentic_multispectral_pipeline.md
    numbers: [exact_k_wirtinger_phase_correlation, exact_k_gradient_descent_phase_correlation]
    evidence:
      - id: ev_exact_k_wf_vs_gd
        description: phase_correlation of Wirtinger flow vs continuous-k gradient descent on the same exact-k data, green, 16px crops
        data_refs:
          - src/ptyco_full_simulator/joint_calibration.py
          - tests/test_gd_solver_pipelines.py
          - scripts/compute_numbers.py
    depends_on: [gd_beats_wirtinger_noiseless]
    status: established

  - id: lena_map_phase_recoverable_with_photons
    statement: >
      On a real-image test object (Lena as amplitude, aerial-photo Map as
      phase, phase max 0.3*pi), the phase is not recovered at a low photon
      budget and becomes recoverable from ~1000 peak photons with the
      amplitude-loss gradient descent; more LEDs help only at a FIXED HR
      canvas (an earlier grid-size sweep was confounded by canvas growth).
      Redundancy vs LED-overlap effects are NOT separated. seed=0 is the
      exact reproducible number; the multi-seed sweep is in
      scripts/sweep_lena_map_noise_and_redundancy.py. Synthetic; the source
      images live outside the repo.
    file: docs/roadmap_agentic_multispectral_pipeline.md
    numbers: [lena_map_gd_phase_correlation_peak_100, lena_map_gd_phase_correlation_peak_1000]
    evidence:
      - id: ev_lena_map_photon_count
        description: phase_correlation of amplitude-loss gradient descent at peak photon count 100 vs 1000, green, 9x9 LEDs, 32px crops
        data_refs:
          - src/ptyco_full_simulator/test_objects.py
          - scripts/sweep_lena_map_noise_and_redundancy.py
          - scripts/compute_numbers.py
    depends_on: [gd_amplitude_loss_survives_poisson_noise]
    status: established
