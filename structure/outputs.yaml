# outputs.yaml -- every artifact the deliverable shows (a figure, a table,
# a results file -- anything, not only LaTeX figures), mapped to the script
# that produced it and the claims it supports.

outputs:
  - label: checks_results
    source: scripts/checks.py
    file: data/checks_results.json
    supports_claims:
      - multispectral_thickness_recovery
      - unwrapping_beats_naive
      - phase_only_solver_limitation
      - led_calibration_recovers_misalignment
