    notes: "*Aplicable (roadmap multiespectral, milestone 2b):* extiende Fourier Ptychographic Topography (mismo marco que FPM, pero mide altura de superficie en vez de fase de un objeto transparente) a dos longitudes de onda simultáneas. Calcula una longitud de onda sintética/'batido' λ_s = λ1·λ2/|λ1-λ2| para ampliar el rango sin ambigüedad de unwrapping a λ_s/2, y resuelve el número de envolvimiento por píxel con una búsqueda robusta a ruido + regularización TV circular global. Validado en silicio estructurado (metrología de semiconductores), no en muestras biológicas ni para recuperar dispersión n(λ). Es el algoritmo de referencia para el unwrapping multi-wavelength del milestone 2b -- adaptar de 'altura de superficie' a 'fase de objeto', no reinventar. (sin PDF descargado en este repo -- preprint reciente, ver docs/literature_check_multispectral_dispersion.md para el detalle completo)"

