# bibliography.yaml -- every paper this project draws on, compiled from
# references/papers/notebook.md's reading pass over ~37 Fourier
# Ptychographic Microscopy (FPM) papers (2013-2026). See notebook.md for
# the full prose version and the reasoning behind `priority_focus` below.
#
# Field meaning:
#   role          theory (grounds a method/claim) | comparison (a baseline
#                 or published number to check computed results against)
#   applicable_to_gap  true if notebook.md flagged this paper (marked with
#                 the wrench in the original notes) as addressing a
#                 concrete gap in the current ptyco_full_simulator code
#   local_file    set only for papers actually downloaded to papers/ --
#                 most are open access; a couple are cited by DOI only
#                 (paywalled or blocked automatic download)
#
# How this plugs into the provenance mechanism (see references/README.md):
#   - cite `local_file` directly as a `data_ref` in structure/claims.yaml
#     for a claim resting on a paper's theory/method.
#   - for a claim COMPARING a computed number against a value published in
#     one of these papers, add that value to data/numbers.json with
#     "type": "source" and "reproduce" set to a citation string (e.g.
#     "zuo2016, Fig. 3") -- source/derivation entries are exempt from the
#     on-disk path check, since a citation isn't a repo path.

# The six gaps notebook.md identified as the highest-value place to start,
# ranked, each pointing at one paper below by id. Rank 7 was added later
# (2026-09-17, see its own "added" field) after being found empirically
# during development, not from notebook.md's original reading pass.
priority_focus:
  - rank: 1
    paper: ou2014
    gap: "pupil recovery / aberration correction (EPRY, 2014)"
    why: >
      `create_pupil()` arma una mascara circular fija que nunca se refina dentro del loop; agregar la actualizacion de pupila al mismo bucle de Wirtinger flow existente no es un cambio de arquitectura.
  - rank: 2
    paper: eckert2018
    gap: "auto-calibracion de angulos LED con datos reales (Eckert/Waller, 2018)"
    why: >
      `led_offset_incorporated` / `led_spacing_error_incorporated` simulan error pero `reconstruct_real_images` no lo corrige; el metodo de correlacion espectral refina angulos dentro del propio solver.
  - rank: 3
    paper: zuo2016
    gap: "step-size adaptativo por convergencia, no por rampa fija (Zuo/Sun/Chen, 2016)"
    why: >
      `mu = min(1-exp(-alpha*ndx), mu_max)` es una rampa fija hardcodeada; reducir mu solo cuando la convergencia se estanca.
  - rank: 4
    paper: zhou2023
    gap: "acelerar reconstruccion con implicit neural representations (FPM-INR, 2023)"
    why: >
      corridas largas con snapshots cada 100 iteraciones sugieren reconstrucciones costosas; reporta hasta 25x mas velocidad y 80x menos memoria.
  - rank: 5
    paper: tian2014
    gap: "multiplexado de LEDs para acortar la captura (Tian/Waller, 2014)"
    why: >
      `toma_muchas_imagenes.py` / `iluminacion_con_toma_de_imagene.py` capturan un LED a la vez; prender varios LEDs random por captura reduce el numero de imagenes.
  - rank: 6
    paper: chen2025
    gap: "cuantificar la confianza de la reconstruccion (Uncertainty-aware FP, 2025)"
    why: >
      las metricas de error solo existen cuando hay target (simulacion); estima un mapa de confianza por region sin ground truth.
  - rank: 7
    paper: rogalski2025
    gap: "recuperacion de fase de baja frecuencia espacial / objetos de fase debil (FPM+TIE, 2025)"
    added: "2026-09-17 -- no estaba en el analisis original de notebook.md; agregado tras encontrar el gap empiricamente, ver abajo"
    why: >
      tests/test_weak_phase_object_limitation.py y docs/roadmap_agentic_multispectral_pipeline.md seccion 1 punto 6:
      un objeto de amplitud uniforme (fase pura) o de fase de baja frecuencia espacial hace que
      `reconstruction.reconstruct` diverja de forma determinista desde la inicializacion estandar
      (el LED on-axis no tiene casi ningun contraste de amplitud para este tipo de objeto -- std/mean=0.0008
      medido directamente). Se confirmo que el problema es un punto silla degenerado, no que el objeto
      sea irrecuperable en principio (perturbaciones chicas alrededor de la solucion verdadera convergen
      bien); tambien se descarto una solucion barata (reintentar con multiples inits al azar y quedarse
      con el de menor recovery_error) porque ese metrica interna no predice la precision real para este
      tipo de objeto. El abstract del paper describe exactamente esta limitacion de FPM y propone agregar
      una imagen desenfocada on-axis + Transport of Intensity Equation como arreglo -- candidato concreto
      para la proxima sesion, posiblemente mas urgente que los gaps #1/#3 para el objetivo real del
      proyecto (muestras biologicas casi transparentes).

